services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - ./backend:/app/src:ro
    networks:
      - vibe-c4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - vibe-c4

networks:
  vibe-c4:
    driver: bridge
